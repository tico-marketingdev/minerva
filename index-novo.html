<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minerva — Performance Digital para Educação</title>
  
<!-- ✅ SEGURANÇA: Content Security Policy -->
 <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self';
  style-src 'self' https://fonts.googleapis.com 'unsafe-inline';
  font-src 'self' https://fonts.gstatic.com;
  img-src 'self' data:;
  connect-src 'self' http://localhost:3000;
  frame-ancestors 'none';
  object-src 'none';
">
  
  <!-- ✅ SEGURANÇA: Outros headers de segurança -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="X-UA-Compatible" content="ie=edge">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  
  <!-- Fonte external (segura) -->
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS Externo (seguro) -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ═════════════════════════════════════════════════════════
       ESTRUTURA HTML (limpa, sem JavaScript inline)
       Renderizada dinamicamente via app.js
       ══════════════════════════════════════════════════════ -->

  <!-- NAV -->
  <nav id="nav-placeholder"></nav>

  <!-- HERO -->
  <section class="hero" id="hero-placeholder">
    <div class="hero-content fade-in" id="hero-content-placeholder"></div>
    <div class="hero-right fade-in" id="hero-right-placeholder"></div>
    <svg class="hero-grafismo" viewBox="0 0 200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 20 L100 180 L180 20" stroke="#43E0C6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <line x1="20" y1="200" x2="180" y2="200" stroke="#43E0C6" stroke-width="8" stroke-linecap="round"/>
      <path d="M60 10 L100 20 L140 10" stroke="#43E0C6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
  </section>

  <!-- LOGOS -->
  <div class="logos-bar" id="logos-placeholder"></div>

  <!-- PROPOSTA -->
  <section class="proposta fade-in" id="proposta-placeholder"></section>

  <!-- FORMULÁRIO -->
  <section class="form-section" id="formulario">
    <div class="form-inner">
      <div class="form-escola-tag">Sou Escola</div>
      <div id="form-wizard"></div>
    </div>
  </section>

  <!-- IA / RESULTADO REAL -->
  <section class="ia-section" id="ia">
    <div class="ia-inner fade-in" id="ia-placeholder"></div>
  </section>

  <!-- ACOMPANHAMENTO -->
  <section class="acomp-section" id="acompanhamento">
    <div id="acomp-placeholder"></div>
  </section>

  <!-- CICLO ESCOLAR -->
  <section class="ciclo-section" id="ciclo" style="background: #fff; padding: rem 4rem;">
    <div id="ciclo-placeholder"></div>
  </section>

  <!-- SERVIÇOS -->
  <section class="servicos" id="servicos">
    <div id="servicos-placeholder"></div>
  </section>

  <!-- COMPARATIVO -->
  <section class="comparativo" id="comparativo-placeholder"></section>

  <!-- CASE -->
  <section class="case-section" id="case">
    <div id="case-placeholder"></div>
  </section>

  <!-- CTA FINAL -->
  <section class="cta-final" id="cta">
    <div id="cta-placeholder"></div>
  </section>

  <!-- FOOTER -->
  <footer id="footer-placeholder"></footer>

  <!-- ═════════════════════════════════════════════════════════
       SCRIPTS EXTERNOS (seguro, sem inline)
       Ordem importa: config.js primeiro, depois app.js
       ══════════════════════════════════════════════════════ -->

  <!-- 1️⃣ Dados (config.js) -->
  <script src="config.js" defer></script>

  <!-- 2️⃣ Lógica (app.js) - renderização + eventos -->
  <script src="app.js" defer></script>

</body>
</html>
